name: Build TrollReverseLab IPA

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:  # 允许手动触发构建

env:
  APP_NAME: TrollReverseLab
  APP_DISPLAY_NAME: TrollAIBio 逆向
  SCHEME: TrollReverseLab
  CONFIGURATION: Release

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build IPA on macOS
    runs-on: macos-15  # macOS 15 with Xcode 16.x (supports project format 77)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch frida-core devkit (17.17.0)
        run: |
          set -e
          FC_VER="17.17.0"
          test -f Vendor/FridaCore/frida-core.h || { echo "::error::Vendor/FridaCore/frida-core.h missing from repo"; exit 1; }
          if [ ! -f Vendor/FridaCore/libfrida-core.a ]; then
            URLS=(
              "https://ghfast.top/https://github.com/frida/frida/releases/download/${FC_VER}/frida-core-devkit-${FC_VER}-ios-arm64.tar.xz"
              "https://github.com/frida/frida/releases/download/${FC_VER}/frida-core-devkit-${FC_VER}-ios-arm64.tar.xz"
            )
            ok=0
            for u in "${URLS[@]}"; do
              echo "Trying $u"
              curl -fL --retry 2 --max-time 300 "$u" -o /tmp/fc.tar.xz && ok=1 && break
            done
            [ "$ok" = "1" ] || { echo "::error::frida-core devkit download failed"; exit 1; }
            mkdir -p /tmp/fcx && tar xJf /tmp/fc.tar.xz -C /tmp/fcx
            cp /tmp/fcx/libfrida-core.a Vendor/FridaCore/libfrida-core.a
          fi
          file Vendor/FridaCore/libfrida-core.a
          ls -la Vendor/FridaCore/

      - name: Install xcodegen
        run: |
          brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd ${{ github.workspace }}
          xcodegen generate
          echo "Xcode project generated"

      - name: Verify project structure
        run: |
          ls -la TrollReverseLab.xcodeproj/
          echo "---"
          find TrollReverseLab -name "*.swift" | head -20

      - name: Build app with xcodebuild
        run: |
          set -o pipefail
          mkdir -p build
          # Xcode may overwrite the source entitlements file during build when
          # CODE_SIGNING_ALLOWED=NO, so back it up first and restore it after.
          cp TrollReverseLab/TrollReverseLab.entitlements build/TrollReverseLab.entitlements.backup
          xcodebuild \
            -project "${{ env.APP_NAME }}.xcodeproj" \
            -scheme "${{ env.SCHEME }}" \
            -configuration "${{ env.CONFIGURATION }}" \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee build/xcodebuild.log
          cp build/TrollReverseLab.entitlements.backup TrollReverseLab/TrollReverseLab.entitlements

      - name: Find built app bundle
        run: |
          APP_PATH=$(find build/DerivedData -name "${{ env.APP_NAME }}.app" -path "*/Release-iphoneos/*" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "::error::Could not find built .app bundle"
            exit 1
          fi
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "Found app at: $APP_PATH"
          
          # List app bundle contents to find the binary
          echo "App bundle contents:"
          ls -la "$APP_PATH/"
          
          # Find the main binary inside the app bundle
          # The binary is usually at the root of the .app bundle
          APP_BINARY=$(find "$APP_PATH" -maxdepth 1 -type f -perm +111 ! -name "*.dylib" ! -name "*.framework" | head -1)
          if [ -z "$APP_BINARY" ]; then
            # Fallback: look for Mach-O binaries
            APP_BINARY=$(find "$APP_PATH" -maxdepth 1 -type f | while read f; do
              if file "$f" | grep -q "Mach-O"; then echo "$f"; break; fi
            done)
          fi
          echo "APP_BINARY=$APP_BINARY" >> $GITHUB_ENV
          echo "Found binary: $APP_BINARY"

      - name: Install ldid for entitlements signing
        run: |
          brew install ldid

      - name: Apply debug entitlements with ldid
        run: |
          ENTITLEMENTS="${{ github.workspace }}/TrollReverseLab/TrollReverseLab.entitlements"
          BINARY="$APP_BINARY"
          
          echo "Entitlements file: $ENTITLEMENTS"
          echo "Binary path: $BINARY"
          
          # Restore entitlements from git index (Xcode may have cleared the working copy)
          echo "Restoring entitlements from git index..."
          git checkout -- TrollReverseLab/TrollReverseLab.entitlements
          
          # Verify files exist
          ls -la "$ENTITLEMENTS"
          ls -la "$BINARY"
          
          # Debug: show actual entitlements content and git state
          echo "===== Entitlements content (first 50 lines) ====="
          head -50 "$ENTITLEMENTS"
          echo "===== Git status ====="
          git status --short
          echo "===== Git file size in index ====="
          git ls-files -s TrollReverseLab/TrollReverseLab.entitlements
          
          file "$BINARY"
          
          # Strip any existing Apple code signature before applying ldid
          # This is critical: TrollStore preserves the entitlements embedded by ldid,
          # but an existing ad-hoc/Apple signature can interfere with the fake-root resign.
          if command -v codesign &> /dev/null; then
            echo "Removing existing code signature (if any)..."
            codesign --remove-signature "$BINARY" 2>/dev/null || true
          fi
          
          # Inject entitlements into the app binary using ldid
          ldid -S"$ENTITLEMENTS" "$BINARY"
          
          # Verify applied entitlements
          echo "Applied entitlements:"
          ldid -e "$BINARY"
          
          # Critical verification: ensure no-sandbox is actually present
          echo "Checking for key entitlements..."
          if ! ldid -e "$BINARY" | grep -q "com.apple.private.security.no-sandbox"; then
            echo "❌ ERROR: com.apple.private.security.no-sandbox entitlement not found in signed binary!"
            exit 1
          fi
          if ! ldid -e "$BINARY" | grep -q "com.apple.security.exception.files.absolute-path.read-write"; then
            echo "❌ ERROR: absolute-path.read-write entitlement not found in signed binary!"
            exit 1
          fi
          echo "✅ Key entitlements verified successfully."

      - name: Build dropbear for iOS arm64
        run: |
          set -e
          DB_VER="2025.88"
          curl -fL "https://matt.ucc.asn.au/dropbear/releases/dropbear-${DB_VER}.tar.bz2" -o /tmp/dropbear.tar.bz2
          file /tmp/dropbear.tar.bz2 | grep -q bzip2 || { echo "::error::下载的不是 tar.bz2"; head -c 300 /tmp/dropbear.tar.bz2; exit 1; }
          tar xjf /tmp/dropbear.tar.bz2 -C /tmp
          cd /tmp/dropbear-${DB_VER}
          export CC="xcrun -sdk iphoneos clang"
          export CFLAGS="-arch arm64 -miphoneos-version-min=14.0 -Os"
          export LDFLAGS="-arch arm64 -miphoneos-version-min=14.0"
          ./configure --host=arm-apple-darwin \
            --disable-zlib --disable-largefile \
            --disable-lastlog --disable-utmp --disable-utmpx --disable-wtmp --disable-wtmpx \
            --disable-pututline --disable-pututxline \
            --disable-loginfunc --disable-shadow --disable-plugin \
            ac_cv_file__dev_urandom=yes
          # iOS patch: passwd shell /bin/sh doesn't exist on iOS; probe fallback chain.
          python3 "$GITHUB_WORKSPACE/scripts/patch_dropbear_shell.py" .
          make -j4 dropbear dropbearkey scp
          mkdir -p "$GITHUB_WORKSPACE/VendorBuilt"
          cp dropbear dropbearkey scp "$GITHUB_WORKSPACE/VendorBuilt/"
          file "$GITHUB_WORKSPACE/VendorBuilt/dropbear"

      - name: Bundle SSH binaries into app
        run: |
          mkdir -p "$APP_PATH/ssh"
          cp VendorBuilt/dropbear VendorBuilt/dropbearkey VendorBuilt/scp "$APP_PATH/ssh/"
          chmod +x "$APP_PATH/ssh"/*
          ENT="$GITHUB_WORKSPACE/TrollReverseLab/TrollReverseLab.entitlements"
          for b in "$APP_PATH"/ssh/*; do
            ldid -S"$ENT" "$b"
          done
          echo "SSH binaries bundled:"
          ls -la "$APP_PATH/ssh"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Bundle frida local-backend assets (best effort)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ENT="$GITHUB_WORKSPACE/TrollReverseLab/TrollReverseLab.entitlements"
          TAG="frida-assets-17.17.0"
          mkdir -p /tmp/frida-assets
          DL=0
          if gh release download "$TAG" -D /tmp/frida-assets --clobber 2>/dev/null; then
            DL=1
          else
            echo "frida assets release $TAG not available — skipping local backend bundle (frida-server backend still works)"
          fi
          if [ "$DL" = "1" ] && [ -f /tmp/frida-assets/frida-helper ]; then
            # frida-core local 后端按 .app 根目录找 frida-helper / frida-agent.dylib
            cp /tmp/frida-assets/frida-helper "$APP_PATH/frida-helper"
            cp /tmp/frida-assets/frida-agent.dylib "$APP_PATH/frida-agent.dylib" 2>/dev/null || true
            [ -f /tmp/frida-assets/frida-server ] && cp /tmp/frida-assets/frida-server "$APP_PATH/frida-server"
            chmod +x "$APP_PATH"/frida-* 2>/dev/null || true
            for b in "$APP_PATH"/frida-helper "$APP_PATH"/frida-agent.dylib "$APP_PATH"/frida-server; do
              [ -f "$b" ] && ldid -S"$ENT" "$b"
            done
            echo "Frida local-backend assets bundled:"
            ls -la "$APP_PATH" | grep frida
          else
            echo "No frida-helper available — app will rely on device frida-server (127.0.0.1:27042)"
          fi

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          
          cd build
          rm -f "${{ env.APP_NAME }}.ipa"
          zip -r "${{ env.APP_NAME }}.ipa" Payload/ -x "*.DS_Store"
          cd ..
          
          IPA_PATH="build/${{ env.APP_NAME }}.ipa"
          echo "IPA_PATH=$IPA_PATH" >> $GITHUB_ENV
          
          echo "IPA created at: $IPA_PATH"
          ls -la "$IPA_PATH"

      - name: Generate SHA256 checksum
        run: |
          shasum -a 256 "$IPA_PATH" > build/ipa_checksum.txt
          cat build/ipa_checksum.txt

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrollReverseLab-IPA
          path: |
            build/TrollReverseLab.ipa
            build/ipa_checksum.txt
          retention-days: 30

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build/xcodebuild.log
          retention-days: 7

      - name: Create GitHub Release with IPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +%Y%m%d%H%M%S)"
          echo "Creating release with tag: $TAG"
          gh release create "$TAG" "$IPA_PATH" \
            --title "${{ env.APP_DISPLAY_NAME }} $TAG" \
            --notes "## ${{ env.APP_DISPLAY_NAME }} Build

          - **Build time**: $(date -u '+%Y-%m-%d %H:%M UTC')
          - **SHA256**: $(cat build/ipa_checksum.txt)

          ### Installation
          1. Download the IPA file below
          2. Transfer to iOS device with TrollStore installed
          3. Open TrollStore and install the IPA" \
            --prerelease

      - name: Build summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **App**: ${{ env.APP_DISPLAY_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Configuration**: Release" >> $GITHUB_STEP_SUMMARY
          echo "- **SDK**: iphoneos (arm64)" >> $GITHUB_STEP_SUMMARY
          echo "- **IPA size**: $(du -h "$IPA_PATH" | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **SHA256**: $(cat build/ipa_checksum.txt)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Installation" >> $GITHUB_STEP_SUMMARY
          echo "1. Download the IPA artifact from this workflow run" >> $GITHUB_STEP_SUMMARY
          echo "2. Transfer to iOS device with TrollStore" >> $GITHUB_STEP_SUMMARY
          echo "3. Open TrollStore and install the IPA" >> $GITHUB_STEP_SUMMARY
